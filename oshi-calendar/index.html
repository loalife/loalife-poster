<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<meta name="description" content="推しの予定と推し活費をまとめて管理するカレンダー">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="推しカレ">
<title>推し活カレンダー</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/app.css?v=14">
</head>
<body>
<div id="bg"></div>
<div id="scrim"></div>
<main class="app" id="app"></main>

<nav class="tabbar" aria-label="メニュー">
  <div class="inner" id="tabs"></div>
</nav>
<dialog class="sheet" id="sheet"></dialog>
<dialog class="confirm" id="confirm"></dialog>
<input type="file" id="photoInput" accept="image/*" class="visually-hidden">
<input type="file" id="importInput" accept="application/json,.json" class="visually-hidden">
<div id="toast" role="status" aria-live="polite"></div>
<div id="penlight" hidden role="dialog" aria-label="ペンライト"></div>

<!-- ファイルを変更したら、この ?v= と sw.js の VERSION をそろえて上げる -->
<script src="js/core.js?v=14"></script>
<script src="js/components.js?v=14"></script>
<script src="js/views/home.js?v=14"></script>
<script src="js/views/calendar.js?v=14"></script>
<script src="js/views/money.js?v=14"></script>
<script src="js/views/notes.js?v=14"></script>
<script src="js/views/event.js?v=14"></script>
<script src="js/views/settings.js?v=14"></script>
<script src="js/forms.js?v=14"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
